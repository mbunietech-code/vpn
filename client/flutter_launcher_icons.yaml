flutter_launcher_icons:
  image_path: "branding/icon.png"

  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "branding/icon-foreground.png"
  min_sdk_android: 21

  windows:
    generate: true
    image_path: "branding/icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "branding/icon.png"

  # The App Store rejects icons with transparency.
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

  # Web can be enabled later:
  # web: { generate: true, image_path: "branding/icon.png", background_color: "#0A1D2E", theme_color: "#2563EB" }
